<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inflection Quest</title>
<style>
:root{--ink:#172033;--blue:#3157a4;--bg:#f5f7fb;--card:#fff;--border:#d9e0ec;--green:#3f8a60;--red:#b54f4f;--gold:#e6a92d}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}main{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.back{color:#3157a4;font-weight:700;text-decoration:none}.panel{background:#fff;border:2px solid var(--border);border-radius:20px;padding:20px;margin-top:14px}.center{text-align:center}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{border:1px solid var(--border);border-radius:12px;padding:8px 12px;font-weight:800}.bar{height:12px;background:#e9edf4;border-radius:99px;overflow:hidden;margin:14px 0}.fill{height:100%;background:var(--blue);width:0;transition:.3s}.word{font-size:clamp(32px,7vw,55px);font-weight:900;margin:22px 0 8px}.suffix{background:#eaf0ff;border-radius:10px;padding:3px 10px}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}.ans,.action{min-height:58px;border:2px solid var(--border);background:#fff;border-radius:14px;font-size:19px;font-weight:800;padding:10px;cursor:pointer}.ans:hover{border-color:var(--blue)}.good{background:#e5f4e9;border-color:var(--green)}.bad{background:#f8e6e6;border-color:var(--red)}.action{width:100%;background:#eaf0ff;border-color:var(--blue);margin-top:10px}.hidden{display:none}.feedback{min-height:58px;font-size:18px;font-weight:800;padding:15px;text-align:center}.map{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0}.level{border:1px solid var(--border);border-radius:12px;padding:10px 5px;text-align:center;font-weight:750;font-size:13px}.locked{opacity:.45}@media(max-width:600px){.answers{grid-template-columns:1fr}.map{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main><div class="top"><a class="back" href="index.html">← Handsaker Arcade</a><b>WORD BUILDER ADVENTURE</b></div>
<section id="home" class="panel center"><div style="font-size:55px">⚔️</div><h1>Inflection Quest</h1><p>Master word endings. Unlock worlds. Defeat the Word Boss.</p><div class="map"><div class="level">🌱<br>-s</div><div class="level locked">🧪<br>-es</div><div class="level locked">🦋<br>Y → I</div><div class="level locked">⏳<br>-ed</div><div class="level locked">🏃<br>-ing</div><div class="level locked">🏰<br>Drop E</div><div class="level locked">⚡<br>Double It</div><div class="level locked">👑<br>Boss</div></div><button id="start" class="action">START QUEST →</button></section>
<section id="game" class="panel hidden"><div class="top"><div><small>CURRENT WORLD</small><h2 id="world" style="margin:2px 0"></h2></div><div class="stats"><span class="stat">⭐ <span id="stars">0</span></span><span class="stat">🔥 <span id="streak">0</span></span><span class="stat" id="hearts">❤️❤️❤️</span></div></div><div class="bar"><div id="fill" class="fill"></div></div><div class="center"><b>BUILD THE WORD</b><div class="word"><span id="base"></span> + <span id="suffix" class="suffix"></span></div><p id="hint"></p></div><div id="answers" class="answers"></div><div id="feedback" class="feedback" aria-live="polite"></div><button id="next" class="action hidden">KEEP GOING →</button></section>
<section id="between" class="panel center hidden"><div style="font-size:55px">🏆</div><h1 id="complete"></h1><p id="unlock"></p><button id="continue" class="action">UNLOCK NEXT LEVEL →</button></section>
<section id="victory" class="panel center hidden"><div style="font-size:70px">👑</div><h1>WORD MASTER!</h1><p>You defeated the Inflection Boss.</p><h2 id="final"></h2><button id="again" class="action">PLAY AGAIN</button></section></main>
<script>
const levels=[
['🌱 The S Meadow','Most words simply add -s.',[['cat','s','cats','cates','catis'],['dog','s','dogs','doges','dogies'],['book','s','books','bookes','bookies'],['tree','s','trees','treees','treies'],['car','s','cars','cares','caries']]],
['🧪 The ES Swamp','Words ending in s, x, z, sh, or ch often add -es.',[['box','es','boxes','boxs','boxies'],['wish','es','wishes','wishs','wishies'],['watch','es','watches','watchs','watchies'],['bus','es','buses','buss','busies'],['buzz','es','buzzes','buzzs','buzzies']]],
['🦋 Y-to-I Valley','With consonant + y, change y to i before the ending.',[['baby','s','babies','babys','babyes'],['fly','s','flies','flys','flyes'],['cry','ed','cried','cryed','cryied'],['carry','ed','carried','carryed','carrid'],['try','ed','tried','tryed','tryied']]],
['⏳ Past-Tense Canyon','Use -ed to show an action already happened.',[['jump','ed','jumped','jumpped','jumpd'],['play','ed','played','plaied','playd'],['help','ed','helped','helpped','helpd'],['rain','ed','rained','rainned','raind'],['look','ed','looked','lookt','lookked']]],
['🏃 ING Rapids','Use -ing for an action happening now.',[['jump','ing','jumping','jumpinng','jumpeng'],['play','ing','playing','plaing','playying'],['read','ing','reading','readding','readeng'],['help','ing','helping','helpping','helpeng'],['rain','ing','raining','rainning','raineng']]],
['🏰 Silent-E Castle','Drop silent e before -ing. For -ed, do not add another e.',[['hope','ing','hoping','hopeing','hopping'],['dance','ing','dancing','danceing','dancinng'],['make','ing','making','makeing','makking'],['hope','ed','hoped','hopeed','hopped'],['smile','ed','smiled','smileed','smilled']]],
['⚡ Double-It Mountain','Short vowel + one consonant? Sometimes double the final consonant.',[['run','ing','running','runing','runnning'],['swim','ing','swimming','swiming','swimmming'],['stop','ed','stopped','stoped','stopt'],['hop','ing','hopping','hoping','hoppping'],['plan','ed','planned','planed','plannned']]],
['👑 THE WORD BOSS','No hints. Use everything you learned!',[['city','s','cities','citys','cityes'],['fix','es','fixes','fixs','fixies'],['race','ing','racing','raceing','raccing'],['drop','ed','dropped','droped','dropd'],['study','ed','studied','studyed','studyd'],['mix','es','mixes','mixs','mixies'],['ride','ing','riding','rideing','ridding'],['clap','ed','clapped','claped','clapd']]]
];let L=0,Q=0,stars=0,streak=0,lives=3,order=[],locked=false;const $=s=>document.querySelector(s),shuffle=a=>a.slice().sort(()=>Math.random()-.5);function show(id){['#home','#game','#between','#victory'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden')}function begin(){Q=0;lives=3;order=shuffle(levels[L][2]);show('#game');render()}function render(){locked=false;let q=order[Q];$('#world').textContent=levels[L][0];$('#base').textContent=q[0];$('#suffix').textContent=q[1];$('#hint').textContent=L===7?'BOSS ROUND — choose carefully!':levels[L][1];$('#stars').textContent=stars;$('#streak').textContent=streak;$('#hearts').textContent='❤️'.repeat(lives)+'♡'.repeat(3-lives);$('#fill').style.width=(Q/order.length*100)+'%';$('#feedback').textContent='';$('#next').classList.add('hidden');let a=$('#answers');a.innerHTML='';shuffle([q[2],q[3],q[4]]).forEach(x=>{let b=document.createElement('button');b.className='ans';b.textContent=x;b.onclick=()=>answer(b,x,q);a.appendChild(b)})}function answer(b,x,q){if(locked)return;if(x===q[2]){locked=true;b.classList.add('good');streak++;let bonus=streak>=5?3:streak>=3?2:1;stars+=bonus;$('#stars').textContent=stars;$('#streak').textContent=streak;$('#feedback').textContent=bonus>1?'🔥 STREAK BONUS! +'+bonus+' stars':'⭐ Correct! +1 star';[...$('#answers').children].forEach(z=>z.disabled=true);$('#fill').style.width=((Q+1)/order.length*100)+'%';$('#next').classList.remove('hidden')}else{b.classList.add('bad');b.disabled=true;streak=0;lives=Math.max(0,lives-1);$('#streak').textContent=0;$('#hearts').textContent='❤️'.repeat(lives)+'♡'.repeat(3-lives);$('#feedback').textContent=lives?'Not yet. Try again!':'💡 Keep going — find the correct spelling!'}}function advance(){Q++;if(Q<order.length)return render();if(L===levels.length-1){show('#victory');$('#final').textContent='⭐ '+stars+' stars earned';return}show('#between');$('#complete').textContent='LEVEL '+(L+1)+' COMPLETE!';$('#unlock').textContent=levels[L+1][0]+' is now unlocked!'}$('#start').onclick=begin;$('#next').onclick=advance;$('#continue').onclick=()=>{L++;begin()};$('#again').onclick=()=>{L=Q=stars=streak=0;lives=3;show('#home')};
</script></body></html>
